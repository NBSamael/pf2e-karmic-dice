name: Release Creation

# Publishing a GitHub release (tag "vX.Y.Z") builds module.zip and attaches it,
# together with a module.json whose version/manifest/download match the release.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Inject Release Values Into module.json
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg version "$VERSION" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.tmp.json
          mv module.tmp.json module.json
          cat module.json

      - name: Create Module Archive
        run: zip --recurse-paths ./module.zip module.json LICENSE README.md CHANGELOG.md esmodules/ languages/ styles/

      - name: Attach Files To Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" module.json module.zip --clobber --repo "${{ github.repository }}"
